services:
  db:
    image: postgres:16-alpine
    container_name: fieldops-db
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldops}
      POSTGRES_USER: ${DB_USER:-fieldops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldops}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fieldops} -d ${DB_NAME:-fieldops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fieldops-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fieldops}
      DB_USER: ${DB_USER:-fieldops}
      DB_PASSWORD: ${DB_PASSWORD:-fieldops}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  db-data:
