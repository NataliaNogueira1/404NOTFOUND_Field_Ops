spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.fieldops: DEBUG
    org.hibernate.SQL: DEBUG

fieldops:
  security:
    jwt:
      # Dev-only default; production MUST provide JWT_SECRET via environment.
      secret: dev-secret-dev-secret-dev-secret-dev-secret-32b
      expiration: 8h
  bootstrap:
    dev-users:
      enabled: ${FIELDOPS_DEV_USERS_ENABLED:true}
      admin:
        name: ${FIELDOPS_DEV_ADMIN_NAME:Admin Dev}
        email: ${FIELDOPS_DEV_ADMIN_EMAIL:admin@fieldops.local}
        password: ${FIELDOPS_DEV_ADMIN_PASSWORD:fieldops-admin-dev}
      supervisor:
        name: ${FIELDOPS_DEV_SUPERVISOR_NAME:Supervisor Dev}
        email: ${FIELDOPS_DEV_SUPERVISOR_EMAIL:supervisor@fieldops.local}
        password: ${FIELDOPS_DEV_SUPERVISOR_PASSWORD:fieldops-supervisor-dev}
      technician:
        name: ${FIELDOPS_DEV_TECHNICIAN_NAME:Tecnico Dev}
        email: ${FIELDOPS_DEV_TECHNICIAN_EMAIL:technician@fieldops.local}
        password: ${FIELDOPS_DEV_TECHNICIAN_PASSWORD:fieldops-technician-dev}
