spring:
  datasource:
    url: jdbc:h2:mem:fieldops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

fieldops:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-test-secret-32
      expiration: 1h
  cors:
    allowed-origins: http://localhost
